name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust JS so phones always get the latest code
        run: |
          V=${GITHUB_SHA::7}
          echo "{\"v\":\"$V\"}" > version.json
          find src -name '*.js' -exec sed -i -E "s#(from '\.[^']*\.js)'#\1?v=$V'#g" {} +
          grep -rn "?v=" index.html src | head -5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
